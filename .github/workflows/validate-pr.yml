name: Validasi PR Praktikum PBWL

on:
  pull_request_target:
    branches:
      - main
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  validate-pr-rules:
    name: Validasi Scope Folder & Format Commit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code PR
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          allow-unsafe-pr-checkout: true

      - name: Fetch Target Branch
        run: |
          git fetch origin ${{ github.base_ref }}:${{ github.base_ref }}

      - name: Validasi Scope Folder (Hanya 1 Folder Mahasiswa)
        run: |
          echo "🔍 Memeriksa file yang diubah dalam PR..."
          CHANGED_FILES=$(git diff --name-only ${{ github.base_ref }}...HEAD)
          
          echo "File yang diubah:"
          echo "$CHANGED_FILES"
          
          # Ambil nama folder tingkat pertama dari setiap file yang diubah
          STUDENT_FOLDERS=$(echo "$CHANGED_FILES" | cut -d'/' -f1 | grep -E '^[0-9]{12}-' | sort -u || true)
          NON_STUDENT_FILES=$(echo "$CHANGED_FILES" | grep -v -E '^[0-9]{12}-' || true)

          # Cek jika ada file di luar folder mahasiswa
          if [ -n "$NON_STUDENT_FILES" ]; then
            echo "❌ ERROR: PR Anda mengubah file di luar folder mahasiswa Anda:"
            echo "$NON_STUDENT_FILES"
            echo "Dilarang mengubah file root (seperti README.md, .gitignore, workflow CI)!"
            exit 1
          fi

          if [ -z "$STUDENT_FOLDERS" ]; then
            echo "❌ ERROR: Tidak ditemukan perubahan pada folder mahasiswa (format: 12digitNIM-NAMA)!"
            exit 1
          fi

          # Cek jumlah folder mahasiswa yang disentuh
          FOLDER_COUNT=$(echo "$STUDENT_FOLDERS" | grep -c -E '^[0-9]{12}-' || true)
          if [ "$FOLDER_COUNT" -gt 1 ]; then
            echo "❌ ERROR: PR Anda mengubah lebih dari 1 folder mahasiswa:"
            echo "$STUDENT_FOLDERS"
            echo "Anda hanya diperbolehkan mengubah folder milik Anda sendiri!"
            exit 1
          fi

          echo "✅ Validasi Scope Folder Lolos! Folder yang diubah: $STUDENT_FOLDERS"

      - name: Validasi Format Commit Message
        run: |
          echo "🔍 Memeriksa format commit message..."
          
          COMMITS=$(git log ${{ github.base_ref }}..HEAD --oneline --format="%s")
          
          VALID_COMMITS=0
          TOTAL_COMMITS=0

          REGEX='^[0-9]{12}[_ -]+.+[_ -]+([Mm][Oo][Dd][Uu][Ll]|[Mm][Dd][Ll])[ _-]*[0-9]+[_ -]+.+'

          while IFS= read -r commit_msg; do
            [ -z "$commit_msg" ] && continue

            # Abaikan commit merge otomatis
            if [[ "$commit_msg" =~ ^Merge[[:space:]] ]]; then
              echo "ℹ️ Mengabaikan commit merge otomatis: \"$commit_msg\""
              continue
            fi

            TOTAL_COMMITS=$((TOTAL_COMMITS + 1))

            if [[ "$commit_msg" =~ $REGEX ]]; then
              echo "✅ Format Commit Benar: \"$commit_msg\""
              VALID_COMMITS=$((VALID_COMMITS + 1))
            else
              echo "⚠️ Format Commit Tidak Sesuai: \"$commit_msg\""
            fi
          done <<< "$COMMITS"

          if [ "$VALID_COMMITS" -lt 1 ]; then
            echo ""
            echo "=========================================================="
            echo "❌ GAGAL: Tidak ditemukan commit yang sesuai format!"
            echo "Format yang diterima: NIM_NamaLengkap_MODUL<X>_NamaAsprak"
            echo "(Boleh menggunakan huruf besar/kecil, pemisah spasi/strip/underscore)"
            echo "Contoh: 250441100096_FahiraAnnisa_Modul3_KakEdi"
            echo "=========================================================="
            exit 1
          fi

          echo "🎉 Lolos! Ditemukan $VALID_COMMITS commit yang sesuai dengan standar."

  php-syntax-check:
    name: Syntax Check PHP (Laravel 13)
    needs: validate-pr-rules
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code PR
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          allow-unsafe-pr-checkout: true

      - name: Fetch Target Branch
        run: |
          git fetch origin ${{ github.base_ref }}:${{ github.base_ref }}

      - name: Setup PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Cek Syntax File PHP yang Diubah
        run: |
          CHANGED_PHP_FILES=$(git diff --name-only ${{ github.base_ref }}...HEAD | grep '\.php$' || true)

          if [ -z "$CHANGED_PHP_FILES" ]; then
            echo "Tidak ada file PHP yang diubah."
            exit 0
          fi

          echo "🔍 Memeriksa sintaks PHP pada file berikut:"
          echo "$CHANGED_PHP_FILES"

          SYNTAX_ERRORS=0
          for file in $CHANGED_PHP_FILES; do
            if [ -f "$file" ]; then
              php -l "$file" || SYNTAX_ERRORS=$((SYNTAX_ERRORS + 1))
            fi
          done

          if [ "$SYNTAX_ERRORS" -gt 0 ]; then
            echo "❌ GAGAL: Ditemukan $SYNTAX_ERRORS file PHP dengan error sintaks!"
            exit 1
          fi

          echo "✅ Semua file PHP bebas dari sintaks error!"
